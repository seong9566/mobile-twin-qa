# <company|personal>/<project>/project.yaml — 공유 설정 (기기별 값은 project.local.yaml)
name: <repo 이름과 동일>
category: personal            # personal | company
repo: https://github.com/<owner>/<repo>.git
branch: main                  # 계획을 쓸 때 기준으로 삼는 브랜치

apps:
  android:
    package: <applicationId>
    launch: <package>/.MainActivity
    permissions:                               # 설치·초기화 뒤 pm grant할 런타임 권한
      - android.permission.ACCESS_FINE_LOCATION
      - android.permission.POST_NOTIFICATIONS
  ios:
    bundle_id: <PRODUCT_BUNDLE_IDENTIFIER>

build:                        # 소스 루트 기준 명령
  android: <예: flutter build apk --debug --dart-define-from-file=$QA_APP_ENV>
  android_apk: <빌드 산출물 경로>
  env_source: .env            # 원본 repo에서 가져올 env 파일 경로
  ios: <예: xcodebuild ... / flutter build ios --simulator>

environments:
  default: local
  local:
    health: http://{{mac_ip}}:5199/health
    start: server/run.sh --urls http://0.0.0.0:5199
    cwd: .
    start_timeout: 180
    vars: { API_BASE_URL: "http://{{mac_ip}}:5199" }
  dev:
    health: https://dev-api.example.com/health
    vars: { API_BASE_URL: "https://dev-api.example.com" }

accounts:                     # 역할 → .env 키 이름 (값은 .env에만)
  # field_worker: { id_env: TEST_USER_ID, password_env: TEST_USER_PASSWORD }

docs:                         # 계획 작성 때 읽을 소스 안 문서 (소스 루트 기준)
  - README.md

runners:
  android: artemis            # artemis | mobile-mcp
  ios: mobile-mcp
